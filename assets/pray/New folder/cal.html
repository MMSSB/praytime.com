<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Calendar</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        body {
            display: flex;
            height: 100vh;
            width: 100%;
            justify-content: center;
            align-items: center;
            place-items: center;
            background: linear-gradient(to right, #9796f0, #42445A);
            overflow: hidden;
        }

        .calendar-container {
            width: 300px;
            height: 400px;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: auto;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        #month-name {
            font-size: 24px;
            font-weight: bold;
        }

        #year-name {
            font-size: 18px;
        }

        .days-of-week {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .days-of-week div {
            width: 40px;
            text-align: center;
        }

        .calendar-days {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .day {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px;
            border-radius: 50%;
            cursor: pointer;
        }

        .day:hover {
            background-color: #ccc;
        }

        .today {
            background-color: #007bff;
            color: #fff;
        }

        .date-options {
            margin-top: 20px;
        }

        .date-options button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .date-options button:hover {
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <div class="calendar-container">
        <div class="calendar-header">
            <h2 id="month-name"></h2>
            <h3 id="year-name"></h3>
        </div>
        <div class="days-of-week">
            <div>Al-Ahad</div>
            <div>Al-Ithnayn</div>
            <div>Al-Thulatha'</div>
            <div>Al-Arba'a'</div>
            <div>Al-Khamis</div>
            <div>Al-Jumu'ah</div>
            <div>Al-Sabt</div>
        </div>
        <div class="calendar-days" id="calendar-days"></div>
        <div class="date-options">
            <button id="gregorian-date">Gregorian Date</button>
            <button id="hijri-date">Hijri Date</button>
        </div>
    </div>

    <script>
        // Get the current date
        const date = new Date();

        // Get the month and year names
        const monthName = getMonthName(date);
        const yearName = date.getFullYear();

        // Get the days of the month
        const daysInMonth = getDaysInMonth(date);

        // Create the calendar
        const calendarDays = document.getElementById('calendar-days');
        const monthHeader = document.getElementById('month-name');
        const yearHeader = document.getElementById('year-name');
        const gregorianDateButton = document.getElementById('gregorian-date');
        const hijriDateButton = document.getElementById('hijri-date');

        monthHeader.textContent = monthName;
        yearHeader.textContent = yearName;

        // Create the days of the month
        for (let i = 1; i <= daysInMonth; i++) {
            const dayElement = document.createElement('div');
            dayElement.textContent = i;
            dayElement.classList.add('day');

            // Check if the day is today
            if (i === date.getDate()) {
                dayElement.classList.add('today');
            }

            calendarDays.appendChild(dayElement);
        }

        // Function to get the month name
        function getMonthName(date) {
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            return months[date.getMonth()];
        }

        // Function to get the days in the month
        function getDaysInMonth(date) {
            return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
        }

        // Function to convert Gregorian date to Hijri date
        function gregorianToHijri(date) {
            const hijriMonths = ['Muharram', 'Safar', 'Rabi\' al-awwal', 'Rabi\' ath-thani', 'Jumada al-awwal', 'Jumada ath-thani', 'Rajab', 'Sha\'ban', 'Ramadan', 'Shawwal', 'Dhu al-Qadah', 'Dhu al-Hijjah'];
            const hijriYear = date.getFullYear() - 622;
            const hijriMonth = date.getMonth();
            const hijriDay = date.getDate();
            return `${hijriDay} ${hijriMonths[hijriMonth]} ${hijriYear}`;
        }

        // Function to convert Hijri date to Gregorian date
        function hijriToGregorian(date) {
            const gregorianMonths = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const gregorianYear = date.getFullYear() + 622;
            const gregorianMonth = date.getMonth();
            const gregorianDay = date.getDate();
            return `${gregorianDay} ${gregorianMonths[gregorianMonth]} ${gregorianYear}`;
        }

        // Event listener for Gregorian date button
        gregorianDateButton.addEventListener('click', () => {
            const gregorianDate = new Date();
            monthHeader.textContent = getMonthName(gregorianDate);
            yearHeader.textContent = gregorianDate.getFullYear();
            calendarDays.innerHTML = '';
            for (let i = 1; i <= getDaysInMonth(gregorianDate); i++) {
                const dayElement = document.createElement('div');
                dayElement.textContent = i;
                dayElement.classList.add('day');
                if (i === gregorianDate.getDate()) {
                    dayElement.classList.add('today');
                }
                calendarDays.appendChild(dayElement);
            }
        });

        // Event listener for Hijri date button
        hijriDateButton.addEventListener('click', () => {
            const hijriDate = new Date();
            monthHeader.textContent = getMonthName(hijriDate);
            yearHeader.textContent = gregorianToHijri(hijriDate);
            calendarDays.innerHTML = '';
            for (let i = 1; i <= getDaysInMonth(hijriDate); i++) {
                const dayElement = document.createElement('div');
                dayElement.textContent = i;
                dayElement.classList.add('day');
                if (i === hijriDate.getDate()) {
                    dayElement.classList.add('today');
                }
                calendarDays.appendChild(dayElement);
            }
        });
    </script>
</body>
</html>
