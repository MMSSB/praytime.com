      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header>
          <h1>Dashboard</h1>
          <p class="date" id="current-date">Thursday, March 20, 2025</p>
        </header>

        <div class="location">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span id="city-name">Loading location...</span>
        </div>

        <div class="current-time">
          <div class="time" id="current-time">12:00:00 PM</div>
          <div class="date-details" id="date-details">Thursday, March 20</div>
          <div class="islamic-date" id="islamic-date">15 Ramadan 1445</div>
          <div class="calendar-type">Islamic Calendar</div>
          <div class="current-prayer" id="current-prayer"></div>
        </div>

        <section class="prayer-times">
          <div class="section-header">
            <h2>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
              Next Prayer
            </h2>
            <div class="tabs">
              <button id="show-today" class="active">Today</button>
              <button id="show-tomorrow">Tomorrow</button>
            </div>
          </div>
        
          <div class="times-container">
            <ul id="times-today" class="prayer-grid">
              <!-- Prayer times for today will be dynamically inserted here -->
            </ul>
            <ul id="times-tomorrow" class="prayer-grid" style="display: none;">
              <!-- Prayer times for tomorrow will be dynamically inserted here -->
            </ul>
          </div>
        </section>
      </main>
    </div>
    <script src="src/adhan.js"></script>
    <script src="src/app.js"></script>
  </body>
