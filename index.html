<div class="location-wrapper">
  <div class="location" id="location-display">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    <span id="city-name">Loading location...</span>
    <button id="edit-location-btn" class="icon-btn" title="Change Location">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
    </button>
  </div>

  <div class="location-search" id="location-search" style="display: none;">
    <div class="search-input-group">
      <input type="text" id="city-search-input" placeholder="Enter city name..." autocomplete="off">
      <button id="close-search-btn" class="icon-btn">✕</button>
    </div>
    <ul id="search-results" class="search-results"></ul>
    <button id="use-gps-btn" class="gps-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5 10 10 0 0 0 0-10Z"/><path d="m9 22 3-9 9-3-9-3-3 9Z"/></svg>
      Use My Current Location
    </button>
  </div>
</div>
        <div class="current-time">

          <div class="date-details" id="date-details">Thursday, March 20</div>

          <div class="calendar-type">Islamic Calendar</div>
          <!-- <div class="current-prayer" id="current-prayer"></div> -->
        </div>

        <section class="prayer-times">
          <div class="section-header">
            <h2>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>
              Next Prayer
            </h2>
            <div class="tabs">
              <button id="show-today" class="active">Today</button>
              <button id="show-tomorrow">Tomorrow</button>
            </div>
          </div>
        
          <div class="times-container">
            <ul id="times-today" class="prayer-grid">
              <!-- Prayer times for today will be dynamically inserted here -->
            </ul>
            <ul id="times-tomorrow" class="prayer-grid" style="display: none;">
              <!-- Prayer times for tomorrow will be dynamically inserted here -->
            </ul>
          </div>
        </section>

<script>
  (function() {
    const theme = localStorage.getItem('theme') || 'system';
    if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      document.body.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
      document.body.classList.remove('dark');
      document.body.classList.add('light');
    }
  })();
</script>
