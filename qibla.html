<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qibla Compass - PrayTime</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="shortcut icon" href="src/pray.ico" type="image/x-icon">
    <style>
        .compass-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        .compass {
            position: relative;
            width: 300px;
            height: 300px;
            background-color: var(--secondary);
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .compass-needle {
            position: absolute;
            width: 4px;
            height: 120px;
            background-color: var(--primary);
            transform-origin: bottom center;
            transition: transform 0.1s ease;
        }
        .compass-center {
            width: 20px;
            height: 20px;
            background-color: var(--primary);
            border-radius: 50%;
            position: absolute;
        }
        .compass-labels {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .compass-labels span {
            position: absolute;
            font-size: 1.2rem;
            color: var(--foreground);
        }
        .compass-labels .north { top: 10px; left: 50%; transform: translateX(-50%); }
        .compass-labels .east { right: 10px; top: 50%; transform: translateY(-50%); }
        .compass-labels .south { bottom: 10px; left: 50%; transform: translateX(-50%); }
        .compass-labels .west { left: 10px; top: 50%; transform: translateY(-50%); }
        .qibla-indicator {
            position: absolute;
            width: 4px;
            height: 140px;
            background-color: #FFD700; /* Gold for Qibla */
            transform-origin: bottom center;
            transition: transform 0.1s ease;
        }
        .status {
            font-size: 1rem;
            color: var(--muted-foreground);
        }
        @media (max-width: 480px) {
            .compass {
                width: 200px;
                height: 200px;
            }
            .compass-needle, .qibla-indicator {
                height: 80px;
            }
            .compass-labels span {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <button class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <aside class="sidebar" id="sidebar">
            <div class="logo">
                <img src="./src/pray.png" alt="Islamic App" class="logo-icon">
                <h2>PrayTime</h2>
            </div>
            <nav>
                <a href="index.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Home
                </a>
                <a href="index-islamic-calendar.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    Islamic Calendar
                </a>
                <a href="index-prayer.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8"/><circle cx="12" cy="12" r="10"/></svg>
                    Prayer Times
                </a>
                <a href="index-qibla.html" class="active">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2v4"/><path d="M12 18v4"/></svg>
                    Qibla Compass
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header>
                <h1>Qibla Compass</h1>
                <p class="date" id="current-date">Tuesday, March 25, 2025</p>
            </header>

            <div class="location">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                <span id="city-name">Loading location...</span>
            </div>

            <section class="prayer-times">
                <div class="section-header">
                    <h2>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2v4"/><path d="M12 18v4"/></svg>
                        Live Qibla Direction
                    </h2>
                </div>
                <div class="times-container">
                    <div class="compass-container">
                        <div class="compass">
                            <div class="compass-labels">
                                <span class="north">N</span>
                                <span class="east">E</span>
                                <span class="south">S</span>
                                <span class="west">W</span>
                            </div>
                            <div class="compass-needle" id="compass-needle"></div>
                            <div class="qibla-indicator" id="qibla-indicator"></div>
                            <div class="compass-center"></div>
                        </div>
                        <p class="status" id="compass-status">Calibrating compass...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="src/qibla.js"></script>
</body>
</html>
