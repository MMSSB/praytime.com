            </header>

            <div class="location">

                <div class="section-header">
                    <h2>

                </div>
                <div class="times-container">
                    <canvas id="compass"></canvas>
                    <div class="current-time">
                        <div class="time" id="qibla-angle">Calculating...</div>
                    </div>
                </div>
            </section>
        </main>
